<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vào học - Course Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* ==== CÀI ĐẶT CHUNG ==== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA; color: #333; display: flex;
      min-height: 100vh; margin: 0;
    }
    .dashboard-container { display: flex; width: 100%; }

    /* ==== SIDEBAR (TỪ INDEX.HTML) ==== */
    .sidebar { width: 240px; background-color: #1D2B4F; color: #A9B4D2; padding: 20px 0; flex-shrink: 0; display: flex; flex-direction: column; height: 100vh; position: fixed; top: 0; left: 0; z-index: 100;}
    .sidebar-header { padding: 0 20px 20px 20px; text-align: center; border-bottom: 1px solid #2C3A5E; margin-bottom: 20px; }
    .sidebar-brand { font-size: 1.6rem; font-weight: bold; color: #FFFFFF; text-decoration: none; }
    .sidebar-nav ul { list-style: none; padding: 0; }
    .sidebar-nav li a { display: flex; align-items: center; padding: 14px 20px; text-decoration: none; color: #A9B4D2; font-weight: 500; transition: all 0.2s ease; border-left: 4px solid transparent; }
    .sidebar-nav li a i { width: 20px; margin-right: 15px; font-size: 1.1rem; text-align: center; }
    .sidebar-nav li.active a { background-color: #0052CC; color: #FFFFFF; border-left-color: #4C9AFF; }
    .sidebar-nav li a:hover { background-color: #2C3A5E; color: #FFFFFF; }
    .admin-only, .instructor-only, .student-only, .logged-in-only { display: none; }
    .logged-out-only { display: block; }
    #logout-button { cursor: pointer; margin-top: auto; border-top: 1px solid #2C3A5E; }

    /* ==== NỘI DUNG CHÍNH (TỪ INDEX.HTML) ==== */
    .main-content { flex-grow: 1; margin-left: 240px; padding: 24px 32px; background-color: #FFFFFF; min-height: 100vh; position: relative; z-index: 1;}
    .main-header { margin-bottom: 24px; }
    /* (Các kiểu .search-bar từ index.html không cần thiết ở đây, nhưng .main-header thì cần) */
    .content-area { margin-top: 20px; }
    .content-area h2 { font-size: 1rem; font-weight: 600; color: #667085; margin-bottom: 20px; text-transform: uppercase; }
    /* (Các kiểu .course-grid, .course-card từ index.html không cần thiết ở đây) */

    #loading-indicator { text-align: center; font-size: 1.2em; color: #667085; padding: 40px; }


    /* ==== CSS ĐẶC THÙ CHO TRANG HỌC (TỪ COURSE_LEARNING.HTML) ==== */
    .course-title-header {
      font-size: 1.8rem;
      font-weight: 600;
      color: #1D2B4F;
      margin-bottom: 20px;
    }

    /* ==== Bố cục trang học ==== */
    .lesson-container {
      display: flex;
      flex-direction: row-reverse; /* Danh sách bài học bên phải */
      gap: 20px;
    }

    /* Khung Video/Nội dung chính */
    .lesson-content-wrapper {
      flex-grow: 3;
      width: 75%;
    }
    .video-player-wrapper {
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      padding-top: 56.25%; /* Tỷ lệ 16:9 */
      height: 0;
      border: 1px solid #E0E0E0;
    }
    .video-player-wrapper iframe,
    .video-player-wrapper .video-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .video-placeholder {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #222;
      color: #888;
    }
    .video-placeholder i { font-size: 3rem; margin-bottom: 15px; }

    /* Danh sách bài học */
    .lesson-list-wrapper {
      flex-grow: 1;
      width: 25%;
      min-width: 300px;
      background-color: #F8F9FA;
      border-radius: 12px;
      border: 1px solid #E0E0E0;
      height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .lesson-list-header {
      padding: 16px;
      font-weight: 600;
      color: #1D2B4F;
      border-bottom: 1px solid #E0E0E0;
      position: sticky;
      top: 0;
      background-color: #F8F9FA;
      z-index: 10;
    }
    .lesson-list {
      list-style: none;
      padding: 0;
      flex-grow: 1;
      overflow-y: auto;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #E0E0E0;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .lesson-item:hover {
      background-color: #EBECF0;
    }
    .lesson-item.active {
      background-color: #E6F0FF;
      font-weight: 600;
      color: #0052CC;
    }
    .lesson-item i {
      width: 20px;
      text-align: center;
      margin-right: 12px;
      color: #0052CC;
    }
    .lesson-title {
      flex-grow: 1;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Mô tả bài học (bên dưới video) */
    .lesson-description-wrapper {
      margin-top: 20px;
      padding: 20px;
      background-color: #FFFFFF;
      border-radius: 12px;
      border: 1px solid #E0E0E0;
    }
    .lesson-description-wrapper h3 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1D2B4F;
      margin-bottom: 10px;
    }
    .lesson-description-wrapper p {
      line-height: 1.6;
      color: #42526E;
    }
    /* Nút Hoàn thành */
    #complete-lesson-btn {
      display: none; /* Ẩn ban đầu */
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background-color: #36B37E; /* Màu xanh lá */
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #complete-lesson-btn:hover:not(:disabled) { background-color: #006644; }
    #complete-lesson-btn:disabled { background-color: #e0e0e0; color: #777; cursor: default; }
    #complete-lesson-btn i { margin-right: 8px; }

    #error-message { text-align: center; font-size: 1.1em; color: #DE350B; padding: 40px; display: none;}

    /* (Toàn bộ CSS cho Card, Modal, Payment từ index.html được giữ lại
       phòng trường hợp cần dùng, nhưng đã bị xóa khỏi bản xem trước này cho ngắn gọn.
       Phần quan trọng là RESPONSIVE ở dưới) */

    /* ==== RESPONSIVE (ĐÃ HỢP NHẤT) ==== */
    @media (max-width: 992px) {
      /* --- Từ index.html (cho sidebar) --- */
      .sidebar { width: 70px; } .sidebar-header .sidebar-brand, .sidebar-nav li a span { display: none; }
      .sidebar-nav li a i { margin-right: 0; font-size: 1.3rem; } .sidebar-nav li a { justify-content: center; }
      .main-content { margin-left: 70px; }

      /* --- Từ course_learning.html (cho nội dung) --- */
      .lesson-container { flex-direction: column; }
      .lesson-content-wrapper { width: 100%; }
      .lesson-list-wrapper { width: 100%; max-width: none; height: auto; max-height: 300px; }
    }

    @media (max-width: 768px) {
      /* --- Từ index.html (cho sidebar + layout) --- */
      body { display: block; }
      .sidebar { width: 100%; height: auto; position: sticky; top:0; flex-direction: row; justify-content: space-around; padding: 0 5px; z-index: 101;}
      .sidebar-header { display: none; } .sidebar-nav ul { display: flex; flex-wrap: wrap; justify-content: center; width: 100%; }
      .sidebar-nav li { margin-bottom: 0; flex-grow: 1; text-align: center;}
      .sidebar-nav li a { flex-direction: column; padding: 8px 5px; font-size: 0.7rem; border-left: none; border-bottom: 4px solid transparent; }
      .sidebar-nav li.active a { border-left: none; border-bottom-color: #4C9AFF; } .sidebar-nav li a i { margin-bottom: 4px; font-size: 1rem;}
      .main-content { margin-left: 0; padding: 16px; margin-top: 60px;}
      #logout-button { margin-top: 0; border-top: none; }
      /* (Các kiểu modal/grid không cần thiết ở đây) */

      /* --- Từ course_learning.html (cho nội dung) --- */
      .course-title-header { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<div class="dashboard-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="sidebar-brand">Courses</a>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li id="menu-dashboard">
          <a href="admin_dashboard.html"><i class="fas fa-tachometer-alt"></i> <span>Dashboard Admin</span></a>
        </li>
        <li id="menu-users">
          <a href="admin_users.html"><i class="fas fa-users"></i> <span>Người Dùng</span></a>
        </li>

        <li id="menu-my-courses">
          <a href="my_courses.html"><i class="fas fa-book-open"></i> <span>Khóa Học Của Tôi</span></a>
        </li>

        <li id="menu-instructor-dashboard">
          <a href="instructor_dashboard.html"><i class="fas fa-chalkboard-teacher"></i> <span>Bảng ĐK Giảng Viên</span></a>
        </li>

        <li id="menu-browse">
          <a href="index.html"><i class="fas fa-compass"></i> <span>Khóa Học</span></a>
        </li>

        <li id="menu-login">
          <a href="login.html"><i class="fas fa-sign-in-alt"></i> <span>Đăng nhập</span></a>
        </li>
        <li id="logout-button">
          <a href="#"><i class="fas fa-sign-out-alt"></i> <span>Đăng xuất</span></a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <header class="main-header">
      <h1 class="course-title-header" id="course-title-header">Đang tải tên khóa học...</h1>
    </header>

    <section class="content-area">
      <p id="loading-indicator">Đang tải nội dung khóa học...</p>
      <p id="error-message"></p>

      <div class="lesson-container" id="lesson-container" style="display: none;">
        <div class="lesson-content-wrapper">
          <div class="video-player-wrapper">
            <div class="video-placeholder" id="video-placeholder">
              <i class="fas fa-play-circle"></i>
              <span>Vui lòng chọn một bài học từ danh sách</span>
            </div>
            <iframe id="video-iframe"
                    src=""
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen
                    style="display: none;">
            </iframe>
          </div>

          <div class="lesson-description-wrapper" id="lesson-description-wrapper" style="display: none;">
            <h3 id="lesson-title-display">Chọn một bài học</h3>
            <p id="lesson-description-display">Mô tả bài học sẽ xuất hiện ở đây.</p>

            <button id="complete-lesson-btn" style="display: none; margin-top: 15px;">
              <i class="fas fa-check-circle"></i> Đánh dấu là đã hoàn thành
            </button>
          </div>
        </div>

        <div class="lesson-list-wrapper">
          <div class="lesson-list-header">Nội dung khóa học</div>
          <ul class="lesson-list" id="lesson-list-ul">
          </ul>
        </div>
      </div>

    </section>
  </main>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements ---
    const token = localStorage.getItem('token');
    const userRole = localStorage.getItem('userRole');
    const courseTitleHeader = document.getElementById('course-title-header');
    const loadingIndicator = document.getElementById('loading-indicator');
    const errorMessage = document.getElementById('error-message');
    const lessonContainer = document.getElementById('lesson-container');
    const videoPlaceholder = document.getElementById('video-placeholder');
    const videoIframe = document.getElementById('video-iframe');
    const lessonListUl = document.getElementById('lesson-list-ul');
    const lessonDescriptionWrapper = document.getElementById('lesson-description-wrapper');
    const lessonTitleDisplay = document.getElementById('lesson-title-display');
    const lessonDescriptionDisplay = document.getElementById('lesson-description-display');
    const completeLessonBtn = document.getElementById('complete-lesson-btn');

    // --- State ---
    let currentCourseId = null;
    let currentLessonId = null;
    let currentLessons = []; // Lưu trữ danh sách bài học
    let completedLessonIds = []; // Lưu trữ ID các bài học đã hoàn thành


    // --- Initial Load ---
    checkLoginStatusAndRedirect();
    fetchLessonData();
    updateSidebarVisibility();
    setActiveMenuItem();

    // --- Event Listeners ---
    lessonListUl.addEventListener('click', (event) => {
      const lessonItem = event.target.closest('.lesson-item');
      if (lessonItem) {
        const lessonId = lessonItem.dataset.lessonId;
        selectLesson(lessonId);
      }
    });

    completeLessonBtn.addEventListener('click', handleCompleteLesson);

    // --- Functions ---

    function checkLoginStatusAndRedirect() {
      if (!token) {
        alert("Vui lòng đăng nhập để vào học.");
        window.location.href = 'login.html';
        return;
      }
      // (Code checkLoginStatus để hiển thị sidebar giữ nguyên)
      const loggedInElements = document.querySelectorAll('.logged-in-only');
      const loggedOutElements = document.querySelectorAll('.logged-out-only');
      const adminElements = document.querySelectorAll('.admin-only');
      if (token && userRole) {
        loggedInElements.forEach(el => el.style.display = 'block');
        loggedOutElements.forEach(el => el.style.display = 'none');
        if (userRole === 'ADMIN') adminElements.forEach(el => el.style.display = 'block');
      } else {
        loggedInElements.forEach(el => el.style.display = 'none');
        loggedOutElements.forEach(el => el.style.display = 'block');
        adminElements.forEach(el => el.style.display = 'none');
      }
      const logoutButton = document.getElementById('logout-button');
      if(logoutButton) logoutButton.addEventListener('click', logout);
    }

    // --- Lấy Course ID từ URL ---
    function getCourseIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('courseId'); // Lấy ?courseId=...
    }

    // --- Gọi API lấy danh sách bài học ---
    // --- Gọi API lấy danh sách bài học và tiến độ ---
    async function fetchLessonData() {
      currentCourseId = getCourseIdFromUrl();
      if (!currentCourseId) {
        showError("Lỗi: Không tìm thấy ID khóa học trong URL.");
        return;
      }

      try {
        // Gọi song song cả 2 API: danh sách bài học và tiến độ
        const [lessonsResponse, completedLessonsResponse] = await Promise.all([
          fetch(`http://localhost:8080/api/courses/${currentCourseId}/lessons`, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          }),
          fetch(`http://localhost:8080/api/progress/courses/${currentCourseId}/completed-lessons`, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          })
        ]);

        loadingIndicator.style.display = 'none'; // Ẩn loading

        // Xử lý response danh sách bài học
        if (!lessonsResponse.ok) {
          if (lessonsResponse.status === 403) {
            showError("Bạn chưa đăng ký khóa học này. Vui lòng đăng ký để vào học.");
          } else {
            showError(`Lỗi ${lessonsResponse.status}: Không thể tải nội dung khóa học.`);
          }
          return;
        }

        const lessonsData = await lessonsResponse.json();

        // Xử lý response tiến độ (completed lessons)
        if (completedLessonsResponse.ok) {
          const completedData = await completedLessonsResponse.json();
          completedLessonIds = completedData.result || [];
        } else {
          console.warn('Could not fetch completed lessons progress.');
          completedLessonIds = []; // Đảm bảo là một mảng rỗng nếu có lỗi
        }

        // Hiển thị danh sách bài học
        if (lessonsData.result && lessonsData.result.length > 0) {
          currentLessons = lessonsData.result;
          displayLessonList(currentLessons);
          courseTitleHeader.textContent = currentLessons[0].courseTitle || "Nội dung khóa học";
          lessonContainer.style.display = 'flex';
          lessonDescriptionWrapper.style.display = 'block';
        } else {
          showError("Khóa học này chưa có bài học nào.");
        }

      } catch (error) {
        showError("Đã xảy ra lỗi khi kết nối tới máy chủ.");
        console.error('Error fetching lessons:', error);
      }
    }

    // --- Hiển thị danh sách bài học ---
    // --- Hiển thị danh sách bài học với trạng thái hoàn thành ---
    function displayLessonList(lessons) {
      lessonListUl.innerHTML = ''; // Xóa danh sách cũ
      lessons.forEach(lesson => {
        const isCompleted = completedLessonIds.includes(lesson.lessonId); // Kiểm tra trạng thái
        const iconClass = isCompleted ? 'fas fa-check-circle' : 'fas fa-play-circle';
        const iconStyle = isCompleted ? 'color: #36B37E;' : ''; // Màu xanh lá cho icon check

        const lessonItemHTML = `
      <li class="lesson-item ${isCompleted ? 'completed' : ''}" data-lesson-id="${lesson.lessonId}">
        <i class="${iconClass}" style="${iconStyle}"></i>
        <span class="lesson-title">${lesson.orderIndex}. ${lesson.title}</span>
      </li>
    `;
        lessonListUl.innerHTML += lessonItemHTML;
      });
    }

    // --- Xử lý khi nhấp vào một bài học ---
    // --- Xử lý khi nhấp vào một bài học ---
    function selectLesson(lessonId) {
      currentLessonId = lessonId; // Lưu ID bài học đang chọn

      // Tìm thông tin bài học từ mảng đã lưu
      const lesson = currentLessons.find(l => l.lessonId == lessonId);
      if (!lesson) return;

      // Đánh dấu active cho bài học
      document.querySelectorAll('.lesson-item').forEach(item => item.classList.remove('active'));
      document.querySelector(`.lesson-item[data-lesson-id="${lessonId}"]`).classList.add('active');

      // Hiển thị nội dung
      videoPlaceholder.style.display = 'none';
      videoIframe.style.display = 'block';
      videoIframe.src = formatEmbedLink(lesson.driveLink); // Chuyển đổi link GDrive

      // Hiển thị mô tả
      lessonTitleDisplay.textContent = lesson.title;
      lessonDescriptionDisplay.textContent = lesson.description || "Bài học này chưa có mô tả.";

      // Cập nhật trạng thái nút "Hoàn thành" dựa trên `completedLessonIds`
      const isAlreadyCompleted = completedLessonIds.includes(lessonId);
      completeLessonBtn.style.display = 'block';
      completeLessonBtn.disabled = isAlreadyCompleted;
      completeLessonBtn.innerHTML = isAlreadyCompleted
              ? '<i class="fas fa-check-double"></i> Đã hoàn thành'
              : '<i class="fas fa-check-circle"></i> Đánh dấu là đã hoàn thành';
    }

    // --- Xử lý nút "Hoàn thành" ---
    // --- Xử lý nút "Hoàn thành" ---
    async function handleCompleteLesson() {
      if (!currentLessonId) {
        alert("Vui lòng chọn một bài học trước.");
        return;
      }

      completeLessonBtn.disabled = true;
      completeLessonBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';

      try {
        const response = await fetch(`http://localhost:8080/api/progress/lessons/${currentLessonId}/complete`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          alert("Đã đánh dấu hoàn thành!");
          completeLessonBtn.innerHTML = '<i class="fas fa-check-double"></i> Đã hoàn thành';
          completeLessonBtn.disabled = true; // Vô hiệu hóa nút sau khi hoàn thành

          // Thêm lessonId vào danh sách đã hoàn thành để cập nhật giao diện
          if (!completedLessonIds.includes(currentLessonId)) {
            completedLessonIds.push(currentLessonId);
          }

          // Đổi icon trong danh sách bài học
          const lessonItem = document.querySelector(`.lesson-item[data-lesson-id="${currentLessonId}"]`);
          if (lessonItem) {
            lessonItem.classList.add('completed'); // Thêm class 'completed'
            const icon = lessonItem.querySelector('i');
            if (icon) {
              icon.className = 'fas fa-check-circle'; // Đổi thành icon check
              icon.style.color = '#36B37E'; // Màu xanh lá
            }
          }
        } else {
          const data = await response.json();
          alert(`Lỗi: ${data.message || 'Không thể lưu tiến độ.'}`);
          completeLessonBtn.disabled = false;
          completeLessonBtn.innerHTML = '<i class="fas fa-check-circle"></i> Đánh dấu là đã hoàn thành';
        }
      } catch (error) {
        console.error('Error completing lesson:', error);
        alert("Lỗi kết nối. Không thể lưu tiến độ.");
        completeLessonBtn.disabled = false;
        completeLessonBtn.innerHTML = '<i class="fas fa-check-circle"></i> Đánh dấu là đã hoàn thành';
      }
    }

    // --- Hiển thị lỗi ---
    function showError(message) {
      loadingIndicator.style.display = 'none';
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    // --- Chuyển đổi link Google Drive ---
    function formatEmbedLink(url) {
      if (url && url.includes("drive.google.com/file/d/") && url.includes("/view")) {
        // Chuyển đổi link 'view' thành 'preview'
        return url.replace("/view", "/preview");
      }
      // (Có thể thêm logic cho Youtube)
      return url; // Trả về link gốc nếu không khớp
    }

    // --- Hàm đăng xuất ---
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userRole');
      localStorage.removeItem('userFullName');
      alert('Bạn đã đăng xuất.');
      window.location.href = 'login.html';
    }

    // DÁN HÀM MỚI NÀY VÀO TẤT CẢ 7 FILE
// (Thay thế hàm 'updateSidebarVisibility' cũ)

    /**
     * Hàm chuẩn hóa mới để cập nhật hiển thị sidebar
     * dựa trên logic vai trò chính xác.
     */
    /**
     * Hàm mới: Tự động đánh dấu "active" cho mục menu của trang hiện tại.
     */
    function setActiveMenuItem() {
      // 1. Lấy tên file của trang hiện tại (ví dụ: "index.html", "my_courses.html")
      const currentPage = window.location.pathname.split('/').pop();

      // 2. Định nghĩa trang nào tương ứng với ID mục menu nào
      const pageToMenuId = {
        'index.html': 'menu-browse',
        'my_courses.html': 'menu-my-courses',
        'course_learning.html': 'menu-my-courses', // 'Vào học' vẫn thuộc 'Khóa học của tôi'
        'instructor_dashboard.html': 'menu-instructor-dashboard',
        'create_course.html': 'menu-instructor-dashboard', // 'Tạo khóa học' thuộc Bảng ĐK
        'edit_course.html': 'menu-instructor-dashboard', // 'Sửa' thuộc Bảng ĐK
        'manage_lessons.html': 'menu-instructor-dashboard', // 'Quản lý bài học' thuộc Bảng ĐK
        'login.html': 'menu-login'
        // Thêm các trang admin nếu cần
        // 'admin_dashboard.html': 'menu-dashboard',
        // 'admin_users.html': 'menu-users',
      };

      // 3. Tìm ID của mục menu cần active (mặc định là 'menu-browse' nếu không tìm thấy)
      const activeMenuId = pageToMenuId[currentPage] || 'menu-browse';

      // 4. Xóa class "active" khỏi TẤT CẢ các mục
      document.querySelectorAll('.sidebar-nav li').forEach(li => {
        li.classList.remove('active');
      });

      // 5. Thêm class "active" cho ĐÚNG mục menu
      const activeMenuItem = document.getElementById(activeMenuId);
      if (activeMenuItem) {
        activeMenuItem.classList.add('active');
      }
    }
    function updateSidebarVisibility() {
      // 1. Lấy thông tin đăng nhập từ localStorage
      const token = localStorage.getItem('token');
      const userRole = localStorage.getItem('userRole'); // 'STUDENT', 'INSTRUCTOR', 'ADMIN'

      // 2. Lấy TẤT CẢ các mục menu bằng ID
      const menuBrowse = document.getElementById('menu-browse');
      const menuMyCourses = document.getElementById('menu-my-courses');
      const menuInstructorDashboard = document.getElementById('menu-instructor-dashboard');
      const menuAdminDashboard = document.getElementById('menu-dashboard');
      const menuAdminUsers = document.getElementById('menu-users');
      const menuLogin = document.getElementById('menu-login');
      const menuLogout = document.getElementById('logout-button');

      // 3. Ẩn tất cả các mục menu đặc thù trước
      if (menuMyCourses) menuMyCourses.style.display = 'none';
      if (menuInstructorDashboard) menuInstructorDashboard.style.display = 'none';
      if (menuAdminDashboard) menuAdminDashboard.style.display = 'none';
      if (menuAdminUsers) menuAdminUsers.style.display = 'none'; // Ẩn mục Người Dùng (bạn không yêu cầu)
      if (menuLogin) menuLogin.style.display = 'none';
      if (menuLogout) menuLogout.style.display = 'none';

      // 4. Luôn hiển thị 'Khóa học' (Browse)
      if (menuBrowse) menuBrowse.style.display = 'block';

      // 5. Xử lý logic Đăng nhập / Đăng xuất
      if (token) {
        // --- ĐÃ ĐĂNG NHẬP ---
        if (menuLogout) menuLogout.style.display = 'block';

        // 6. Xử lý hiển thị theo vai trò (Role)
        if (userRole === 'STUDENT') {
          if (menuMyCourses) menuMyCourses.style.display = 'block';

        } else if (userRole === 'INSTRUCTOR') {
          if (menuInstructorDashboard) menuInstructorDashboard.style.display = 'block';

        } else if (userRole === 'ADMIN') {
          if (menuAdminDashboard) menuAdminDashboard.style.display = 'block';
          // Lưu ý: Theo yêu cầu của bạn, 'menu-users' không hiển thị
        }

      } else {
        // --- CHƯA ĐĂNG NHẬP ---
        if (menuLogin) menuLogin.style.display = 'block';
      }
    }
  });
</script>
