spring.application.name=online_course_platform
spring.datasource.url=jdbc:mysql://localhost:3306/khoahoconl
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (ORM)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# JWT Secret Key
jwt.secret=ThisIsMySuperSecretKeyForJWT1234567890a
jwt.expiration=86400000

server.port=8080

spring.ai.openai.api-key=your_openai_api_key
debug=true

file.upload-dir=E:/uploads/images/
file.access-path=/images/


# C?u hình gi?i h?n kích th??c file upload (tùy ch?n)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB